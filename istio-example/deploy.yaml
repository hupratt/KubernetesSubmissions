apiVersion: v1
kind: Namespace
metadata:
  name: istio-example
  labels:
    environment: test
    istio.io/dataplane-mode: ambient

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-dep
  namespace: istio-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: seedimage
          image: europe-north1-docker.pkg.dev/project-f5db746b-2bc2-4fda-a87/my-docker-reg/hello-world-webapp:latest
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
---

apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: istio-example
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080