name: Build and push to github

on:
  push:
    branches: [main]      # staging
    tags: ['v*']          # prod

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-docker-reg
  TAG: ${{ github.ref_name }}-${{ github.sha }}

jobs:
  build-pub:
    name: Build and Publish (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: todo,     dir: ./the_project, image: todo-app }
          - { name: pingpong, dir: ./log_output,  image: log_output }
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker "$REGISTRY"

      - name: Build and push
        run: |
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/${{ matrix.app.image }}:$TAG"
          docker build --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

  update-manifests:
    name: Update ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }} manifests
    needs: build-pub
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
    permissions:
      contents: write
    env:
      OVERLAY: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set images in overlays
        run: |
          PREFIX="$REGISTRY/$PROJECT_ID/$REPOSITORY"

          # left side = image string exactly as written in the rollout manifest
          (cd the_project/overlays/$OVERLAY && \
            kustomize edit set image PROJECT/IMAGE="$PREFIX/todo-app:$TAG")

          (cd log_output/overlays/$OVERLAY && \
            kustomize edit set image PROJECT/IMAGE="$PREFIX/log_output:$TAG")

          # fail loudly if the tag didn't land in the rendered output
          kustomize build the_project/overlays/$OVERLAY | grep -q "todo-app:$TAG"
          kustomize build log_output/overlays/$OVERLAY  | grep -q "log_output:$TAG"

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add the_project/overlays/$OVERLAY/kustomization.yaml \
                  log_output/overlays/$OVERLAY/kustomization.yaml
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update $OVERLAY images to $TAG [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done