name: Release application

on:
  push:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-docker-reg
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: todo
            dir: ./the_project
            image: todo-app
            service: todo
            kustomize_image: PROJECT/IMAGE
            main_namespace: project
          - name: pingpong
            dir: ./log_output
            image: log_output # image name
            service: logoutput # deployment name
            kustomize_image: PROJECT/IMAGE
            main_namespace: exercises
    env:
      IMAGE: ${{ matrix.app.image }}
      SERVICE: ${{ matrix.app.service }}
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY"

      - name: Form the image name
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: docker build --tag $IMAGE_TAG .

      - name: Publish
        run: docker push $IMAGE_TAG

      - name: Deploy
        env:
          MAIN_NAMESPACE: ${{ matrix.app.main_namespace }}
        run: |-
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            NAMESPACE=$MAIN_NAMESPACE
          else
            NAMESPACE=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '/_' '--')
          fi
          kubectl create namespace $NAMESPACE || true
          kubectl config set-context --current --namespace=$NAMESPACE
          kustomize edit set namespace $NAMESPACE
          kustomize edit set image ${{ matrix.app.kustomize_image }}=$IMAGE_TAG
          kustomize build . | kubectl apply -f -
          kubectl get services -o wide