name: Release application

on:
  push:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-docker-reg
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish:
    # prevent it from running if . in the branch name
    if: ${{ !contains(github.ref_name, '.') }}
    name: Build and Publish (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: todo
            dir: ./the_project
            image: todo-app
            main_namespace: project

          - name: pingpong
            dir: ./log_output
            image: log_output
            main_namespace: exercises
    env:
      IMAGE: ${{ matrix.app.image }}
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY"

      - name: Form the image name
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: docker build --tag $IMAGE_TAG .

      - name: Publish
        run: docker push $IMAGE_TAG

      - name: Update image in kustomization
        run: kustomize edit set image PROJECT/IMAGE=$IMAGE_TAG

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "Update ${{ matrix.app.name }} image to $IMAGE_TAG [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 3
          done