name: Cleanup branch namespace

on:
  delete:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b

jobs:
  cleanup:
    # delete also fires for tags; never touch main's namespace
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    name: Delete branch namespace
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - uses: google-github-actions/setup-gcloud@v3

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Delete namespace
        env:
          REF_NAME: ${{ github.event.ref }}
        run: |
          NAMESPACE=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '/_' '--')

          # record NEG names before anything is deleted
          NEGS=$(kubectl get svcneg -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
          echo "NEGs to clean up: ${NEGS:-none}"

          kubectl delete httproute --all -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=300s
          kubectl delete service --all -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=300s

          for NEG in $NEGS; do
            DONE=false
            for i in $(seq 1 30); do
              # find backend services pointing at this NEG (client-side match, no gcloud filter)
              for BS in $(gcloud compute backend-services list --global --format=json \
                            | jq -r --arg neg "$NEG" '.[] | select(any(.backends[]?; .group | endswith("/" + $neg))) | .name'); do
                gcloud compute backend-services delete "$BS" --global --quiet || echo "backend service $BS not deletable yet"
              done

              if OUT=$(gcloud compute network-endpoint-groups delete "$NEG" --zone="$GKE_ZONE" --quiet 2>&1); then
                echo "deleted $NEG"; DONE=true; break
              fi
              if echo "$OUT" | grep -qi "not found"; then
                echo "$NEG already gone"; DONE=true; break
              fi
              echo "$OUT" >&2
              echo "retrying ($i/30)..."
              sleep 10
            done

            [ "$DONE" = true ] || { echo "could not delete NEG $NEG" >&2; exit 1; }
          done

          kubectl delete namespace "$NAMESPACE" --ignore-not-found --timeout=300s