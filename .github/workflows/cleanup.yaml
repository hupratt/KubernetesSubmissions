name: Cleanup branch namespace

on:
  delete:

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b

jobs:
  cleanup:
    # delete also fires for tags; never touch main's namespace
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    name: Delete branch namespace
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - uses: google-github-actions/setup-gcloud@v3

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Delete namespace
        env:
          REF_NAME: ${{ github.event.ref }}
        run: |
          NAMESPACE=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '/_' '--')

          # svcneg objects are named after the real NEG, so record them before anything is deleted
          NEGS=$(kubectl get svcneg -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

          # remove routing and services
          kubectl delete httproute --all -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=300s
          kubectl delete service --all -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=300s

          # the svcneg and the NEG still exists in GCP, delete its backend service, then the NEG
          for NEG in $NEGS; do
            gcloud compute network-endpoint-groups list \
              --filter="name=$NEG" --format="value(zone.basename())" |
            while read -r ZONE; do
              for BS in $(gcloud compute backend-services list --global \
                            --filter="backends.group~/${NEG}$" --format="value(name)"); do
                gcloud compute backend-services delete "$BS" --global --quiet
              done
              gcloud compute network-endpoint-groups delete "$NEG" --zone="$ZONE" --quiet
            done
          done

          kubectl delete namespace "$NAMESPACE" --ignore-not-found --timeout=300s