apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: logoutput
  namespace: exercises
spec:
  replicas: 4
  selector:
    matchLabels:
      app: logoutput
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: cpu-usage
              - templateName: restart-rate
            args:
              - name: container
                value: logoutput-expose
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      containers:
        - name: logoutput-expose
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: INFO_FILE
              value: "/config/information.txt"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: information-volume
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: logoutput-producer
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: log-output-db
                  key: DATABASE_URL
          command: ["python", "pingpong.py"]
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: information-volume
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
