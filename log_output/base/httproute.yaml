apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logoutput-route
spec:
  parentRefs:
    - name: pingpong-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        # The Gateway receives /pingpong, rewrites it to /, and the app sees /
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong-lb
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /pings
      backendRefs:
        - name: pingpong-lb
          port: 80
    # Canary split: v1 / v2
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logoutput-v1
          port: 80
          weight: 50
        - name: logoutput-v2
          port: 80
          weight: 50
