apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logoutput-route
spec:
  parentRefs:
    - name: pingpong-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
      # The Gateway receives /pingpong, rewrites it to /, and the app sees /
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong-lb
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /pings
      backendRefs:
        - name: pingpong-lb
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logoutput-lb
          port: 80
---

apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: pingpong-hc
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8001
        requestPath: /pings
  targetRef:
    group: ""
    kind: Service
    name: pingpong-lb

