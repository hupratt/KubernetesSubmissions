apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
---
# Headless Service gives each StatefulSet Pod a stable DNS record
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-auth
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            periodSeconds: 10
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

        - name: db-bootstrap
          image: postgres:17-alpine
          env:
            - name: PGHOST
              value: localhost
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e

              until pg_isready; do
                sleep 2
              done

              psql -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'CREATE DATABASE todos'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'todos')
              \gexec

              SELECT 'CREATE DATABASE pingpong'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'pingpong')
              \gexec
              SQL

              echo "bootstrap done"

              while true; do
                sleep 3600
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi