apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logoutput-route
  namespace: exercises
spec:
  parentRefs:
  - name: my-gateway
    namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      backendRefs:
        - name: pingpong-lb
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: logoutput-lb
          port: 80
