
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage
  namespace: default
spec:
  metrics:
    - name: namespace-cpu-usage
      initialDelay: 1m
      interval: 30s
      count: 10
      successCondition: len(result) > 0 && result[0] < 0.5
      failureLimit: 0
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(
              rate(container_cpu_usage_seconds_total{
                namespace="exercises",
                container!="",
                image!=""
              }[5m])
            )
