apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      containers:
        - name: logoutput-expose
          image: hupratt/log_output:2.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
        - name: logoutput-producer
          image: hupratt/log_output:2.1
          imagePullPolicy: Always
          command: ["python", "pingpong.py"]
          ports:
            - containerPort: 8001