apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: logoutput-expose
          image: hupratt/log_output:1.11
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
          - name: shared-logs
            mountPath: /var/log
        - name: logoutput-producer
          image: hupratt/log_output:1.11
          imagePullPolicy: Always
          command: ["python", "produce.py"]
          volumeMounts:
          - name: shared-logs
            mountPath: /var/log