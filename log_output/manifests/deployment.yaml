apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      containers:
        - name: logoutput-expose
          image: hupratt/log_output:2.8
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: INFO_FILE
              value: "/config/information.txt"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: information-volume
              mountPath: /config
              readOnly: true
        - name: logoutput-producer
          image: hupratt/log_output:2.8
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: log-output-db
                  key: DATABASE_URL
          command: ["python", "pingpong.py"]
          ports:
            - containerPort: 8001
      volumes:
        - name: information-volume
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt