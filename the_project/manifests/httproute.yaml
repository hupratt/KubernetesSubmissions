apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-route
  namespace: ${NAMESPACE}
spec:
  parentRefs:
  - name: my-gateway
    namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todo-svc
          port: 2345
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
        - name: todo-svc
          port: 2345