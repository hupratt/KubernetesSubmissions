apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo
          image: hupratt/todo-app:1.2
          imagePullPolicy: Always
          env:
            - name: UVICORN_PORT
              value: "9000"
          ports:
            - containerPort: 9000