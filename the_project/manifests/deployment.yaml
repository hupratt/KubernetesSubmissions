apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo
          image: hupratt/todo-app:2.10
          imagePullPolicy: Always
          env:
            - name: UVICORN_PORT
              value: "9001"
            - name: PICSUM_URL
              value: "https://picsum.photos/600"
            - name: TTL_SECONDS
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 9001