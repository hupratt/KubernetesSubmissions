apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          env:
            - name: UVICORN_PORT
              value: "9001"
            - name: PICSUM_URL
              value: "https://picsum.photos/600"
            - name: TTL_SECONDS
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 9001
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 1