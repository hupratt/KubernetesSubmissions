apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          command: ["/todo-app/.venv/bin/python", "/todo-app/src/todo_app/broadcaster.py"]
          image: PROJECT/IMAGE
          env:
            - name: NATS_URL
              value: nats://my-nats-0.my-nats-headless.nats.svc.cluster.local:4222
            - name: NATS_SUBJECT
              value: todos.events
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# Create the secret
# right click on a channel>integrations> create webhook

# kubectl create secret generic discord-webhook -n project \
#   --from-literal=url='https://discord.com/api/webhooks/<id>/<token>'


