apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: restart-rate
  namespace: default
spec:
  metrics:
  - name: restart-rate
    initialDelay: 2m
    successCondition: result < 2
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
        query: |
          scalar(
            sum(kube_pod_container_status_restarts_total{namespace="project", container="todo"}) -
            sum(kube_pod_container_status_restarts_total{namespace="project", container="todo"} offset 2m)
          )