apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: todo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: todo
  strategy:
    canary:
      steps:
      - setWeight: 50
      - analysis:
          templates:
          - templateName: restart-rate
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
        - name: todo
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          env:
            - name: UVICORN_PORT
              value: "9001"
            - name: PICSUM_URL
              value: "https://picsum.photos/600"
            - name: TTL_SECONDS
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoapp-secret
                  key: DATABASE_URL
            - name: NATS_URL
              value: nats://my-nats-0.my-nats-headless.nats.svc.cluster.local:4222
            - name: NATS_SUBJECT
              value: todos.events
          ports:
            - name: http
              containerPort: 9001
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 1
