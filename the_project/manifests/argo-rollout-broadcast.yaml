apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: broadcaster
spec:
  replicas: 4
  selector:
    matchLabels:
      app: broadcaster
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: PROJECT/IMAGE
          imagePullPolicy: Always
          command: ["/todo-app/.venv/bin/python", "/todo-app/src/todo_app/broadcaster.py"]
          env:
            - name: NATS_URL
              value: nats://my-nats-0.my-nats-headless.nats.svc.cluster.local:4222
            - name: NATS_SUBJECT
              value: todos.events
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: url
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }