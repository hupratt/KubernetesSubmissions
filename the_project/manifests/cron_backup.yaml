apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-db-backup
  namespace: ${NAMESPACE}
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir: {}
            - name: gcp-key
              secret:
                secretName: storage-sa-key
          initContainers:
            - name: pg-dump
              image: postgres:17
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: todoapp-secret
                      key: DATABASE_URL
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump --no-owner --clean --if-exists -d "$DATABASE_URL" \
                    -f /backup/todos-$(date +%Y-%m-%d_%H%M%S).sql
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: google/cloud-sdk:slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  gcloud auth activate-service-account --key-file=/secrets/key.json
                  gcloud storage cp /backup/*.sql gs://todo_bucket_1/todo-db/
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: gcp-key
                  mountPath: /secrets
                  readOnly: true