apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

configurations:
- nameref.yaml

resources:
- ./../../base

namePrefix: prod-

patches:
  - target:
      kind: Secret
      name: todoapp-secret   # original name, before the prefix
    patch: |-
      - op: replace
        path: /stringData/DATABASE_URL
        value: "postgresql://postgres:strongpw@prod-postgres-headless.staging.svc.cluster.local:5432/todos"