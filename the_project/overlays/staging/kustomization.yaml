apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- ./../../base

images:
- name: PROJECT/IMAGE
  newName: europe-north1-docker.pkg.dev/project-f5db746b-2bc2-4fda-a87/my-docker-reg/todo-app
  newTag: main-cace066b3ed43d258e3939bccb9fe8dcb1bec7d3

  # broadcaster: don't connect to NATS or Discord

  # Publisher: don't connect to NATS
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: DISCORD_ENABLED
        value: "false"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NATS_ENABLED
        value: "false"
  target:
    group: argoproj.io
    kind: Rollout
    name: broadcaster
    version: v1alpha1
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NATS_ENABLED
        value: "false"
  target:
    group: argoproj.io
    kind: Rollout
    name: todo
    version: v1alpha1
