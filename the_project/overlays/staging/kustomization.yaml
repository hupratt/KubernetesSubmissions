apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

configurations:
- nameref.yaml

resources:
- ./../../base
namePrefix: staging-

patches:
  - target:
      kind: Secret
      name: todoapp-secret   # original name, before the prefix
    patch: |-
      - op: replace
        path: /stringData/DATABASE_URL
        value: "postgresql://postgres:strongpw@staging-postgres-headless.staging.svc.cluster.local:5432/todos"

images:
- name: todo-app
  newName: europe-north1-docker.pkg.dev/project-f5db746b-2bc2-4fda-a87/my-docker-reg/todo-app
  newTag: main-5bb09292b919aa75c1e8b4ed63e7fe82f37a02c5