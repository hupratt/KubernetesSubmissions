apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

configurations:
- nameref.yaml

resources:
- ./../../base
namePrefix: staging-

patches:
- patch: |-
    - op: replace
      path: /stringData/DATABASE_URL
      value: "postgresql://postgres:strongpw@staging-postgres-headless.staging.svc.cluster.local:5432/todos"
  target:
    kind: Secret
    name: todoapp-secret

images:
- name: todo-app
  newName: europe-north1-docker.pkg.dev/project-f5db746b-2bc2-4fda-a87/my-docker-reg/todo-app
  newTag: main-512d3a8b29a6ce5a547472d3d8db4cc26cfdf550
